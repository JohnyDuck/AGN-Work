# ᴀᴇᴛʜᴇʀɢʟɪᴛᴄʜ | TNT-Run Configuration
# Только бренд ᴀᴇᴛʜᴇʀɢʟɪᴛᴄʜ в small caps, остальной текст обычным шрифтом
# Координаты/миры АРЕН — в отдельном файле arenas.yml !

brand: "ᴀᴇᴛʜᴇʀɢʟɪᴛᴄʜ"

game:
  min-players: 2
  max-players: 25
  countdown: 60
  announce-at: [60, 30, 20, 10, 5, 4, 3, 2, 1]
  freeze-until-start: true
  no-decay-in-lobby: true
  teleport-to-lobby-on-join: true
  start-title-enabled: true
  allow-pvp: false
  cooldown-join-seconds: 2

blocks:
  decay-materials:
    # Падающие блоки (полный ванильный набор): песок/гравий + сухой бетон всех 16 цветов
    - SAND
    - RED_SAND
    - GRAVEL
    - WHITE_CONCRETE_POWDER
    - ORANGE_CONCRETE_POWDER
    - MAGENTA_CONCRETE_POWDER
    - LIGHT_BLUE_CONCRETE_POWDER
    - YELLOW_CONCRETE_POWDER
    - LIME_CONCRETE_POWDER
    - PINK_CONCRETE_POWDER
    - GRAY_CONCRETE_POWDER
    - LIGHT_GRAY_CONCRETE_POWDER
    - CYAN_CONCRETE_POWDER
    - PURPLE_CONCRETE_POWDER
    - BLUE_CONCRETE_POWDER
    - BROWN_CONCRETE_POWDER
    - GREEN_CONCRETE_POWDER
    - RED_CONCRETE_POWDER
    - BLACK_CONCRETE_POWDER
  under-material: TNT
  decay-delay-ticks: 10
  instant-remove: true
  no-drops: true
  regenerate: true
  particles: true
  sound-on-decay: true

rewards:
  enabled: true
  commands:
    - "give %winner% diamond 3"

stats:
  save-interval-seconds: 60
  file: "stats.yml"

titles:
  countdown-title: "Старт через <sec>"
  countdown-subtitle: "Приготовься!"
  go-title: "Поехали!"
  go-subtitle: "Беги!"
  win-title: "Победа!"
  win-subtitle: "%winner%"

sounds:
  countdown: "BLOCK_NOTE_BLOCK_HAT"
  countdown-final: "BLOCK_NOTE_BLOCK_PLING"
  start: "ENTITY_ENDER_DRAGON_GROWL"
  win: "UI_TOAST_CHALLENGE_COMPLETE"
  lose: "ENTITY_VILLAGER_DEATH"

messages:
  prefix: "ᴀᴇᴛʜᴇʀɢʟɪᴛᴄʜ » "
  joined: "%player% присоединился (%count%/%max%)"
  left: "%player% вышел (%count%/%max%)"
  need-more: "Нужно минимум %min% игроков для старта"
  countdown: "Старт через %sec% сек."
  countdown-cancelled: "Старт отменён, недостаточно игроков"
  game-started: "Игра началась! Беги!"
  already-in-game: "Ты уже в игре"
  game-full: "Арена заполнена (макс. %max%)"
  game-already-started: "Игра уже идёт, дождись окончания"
  win: "Победил %winner%!"
  teleported-back: "Ты возвращён на прежнее место"
  no-permission: "Нет прав"
  reloaded: "Конфиг перезагружен"
  arena-saved: "Арена сохранена"
  lobby-set: "Лобби установлено"
  spawn-added: "Точка спавна добавлена (%count%)"
  spawns-cleared: "Точки спавна очищены"
  center-set: "Центр арены установлен"
  radius-set: "Радиус установлен: %radius%"
  floor-set: "Высота пола установлена: %y%"
  world-set: "Мир арены: %world%"
  stats-header: "— Статистика %player% —"
  stats-line: "Побед: %wins% | Игр: %games% | Винрейт: %winrate%%"
  top-header: "— Топ игроков —"
  top-line: "#%pos% %player% — %wins% побед (%games% игр)"
  top-empty: "Топ пока пуст"
  not-in-game: "Ты не в игре"
  only-players: "Только для игроков"
  eliminated: "%player% выбыл!"
  spectate: "Ты теперь наблюдатель"
  forced-start: "Игра принудительно запущена"
  forced-stop: "Игра остановлена"
  not-enough-players: "Недостаточно игроков"
  cooldown: "Подожди %sec% сек. перед повторным входом"

placeholders:
  top-size: 10
