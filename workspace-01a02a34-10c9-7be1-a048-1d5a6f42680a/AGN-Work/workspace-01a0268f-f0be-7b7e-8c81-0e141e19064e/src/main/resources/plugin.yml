name: AetherGlitchTNTRun
version: '1.0.0'
main: com.aetherglitch.tntrun.AetherGlitchTNTRun
api-version: '1.21'
prefix: AetherGlitch
author: AetherGlitch
softdepend: [PlaceholderAPI]
commands:
  tntrun:
    description: TNT-Run main command
    usage: /tntrun <join|leave|start|stop|reload|top|stats>
    aliases: [tr, tntr, tnt]
  tnt:
    description: TNT-Run alias
    usage: /tnt <join|leave|start|stop|reload|top|stats>
    aliases: [tr2]
  aetherglitch:
    description: alias
    usage: /aetherglitch
permissions:
  aetherglitch.admin:
    description: admin
    default: op
  aetherglitch.play:
    description: play
    default: true
